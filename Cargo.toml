[package]
name = "esp-p4-psram"
version = "0.1.0"
edition = "2021"
description = "ESP32-P4 Octal/Hex PSRAM bring-up — clean Rust port of IDF v5.4's `esp_psram_impl_ap_hex.c`. Programs MSPI_2/MSPI_3 controllers, PSRAM mode registers (vendor/density read, X16 + page-mode + fixed-latency write), cache-side OPI/Hex DDR config, MMU 32 MB window mapping. Hardware-validated end-to-end on Waveshare ESP32-P4-ETH (vendor=0x0D, 32 MB)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/babasha/esp-p4-psram"
readme = "README.md"
keywords = ["esp32p4", "psram", "no-std", "embedded", "espressif"]
categories = ["embedded", "hardware-support", "memory-management", "no-std"]

[lib]
name = "psram"
path = "src/lib.rs"

[features]
default = []

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp32p4 = { version = "0.2", features = ["rt"] }
bootloader = { package = "esp-p4-bootloader", version = "0.1" }
